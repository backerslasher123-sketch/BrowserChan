<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Board</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1 class="title">Create New Board</h1>

    <div class="sub-link"><a href="index.html">Return to dashboard</a></div>

    <div class="dashboard-container">
        <fieldset class="section-box">
            <legend>Board Details</legend>
            <form onsubmit="handleCreate(event)">
                <p>
                    <label><strong>Board URI (e.g. 'b', 'tech', 'h'):</strong></label><br>
                    <input type="text" id="boardUri" required placeholder="b" style="width: 200px;">
                </p>
                <p>
                    <label><strong>Board Title:</strong></label><br>
                    <input type="text" id="boardTitle" required placeholder="Random" style="width: 300px;">
                </p>
                <p>
                    <button type="submit" class="btn-submit">Create Board</button>
                </p>
            </form>
        </fieldset>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/verify.js"></script>
    <script>
        function handleCreate(e) {
            e.preventDefault();
            const uri = document.getElementById('boardUri').value.trim();
            const title = document.getElementById('boardTitle').value.trim();
            if (Imageboard.createBoard(title, uri, '')) {
                alert('Board /' + uri + '/ created successfully!');
                window.location.href = 'board.html?b=' + uri;
            } else {
                alert('Board URI already exists!');
            }
        }
    </script>
</body>
</html>
