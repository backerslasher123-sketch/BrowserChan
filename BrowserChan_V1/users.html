<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users & Roles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1 class="title">User Role Management</h1>

    <div class="sub-link"><a href="index.html">Return to dashboard</a></div>

    <div class="dashboard-container">
        <fieldset class="section-box">
            <legend>Promote User to Janitor</legend>
            <form onsubmit="handlePromote(event)">
                <p>
                    <label><strong>Username:</strong></label><br>
                    <input type="text" id="janitorUser" required style="width: 250px;">
                </p>
                <p>
                    <button type="submit" class="btn-submit">Promote to Janitor</button>
                </p>
            </form>
        </fieldset>

        <fieldset class="section-box" style="border-color: var(--main-red);">
            <legend style="color: var(--main-red);">Retire Admin & Transfer Ownership</legend>
            <form onsubmit="handleRetire(event)">
                <p>Promote another user to <strong>Main Site Owner/Admin</strong> and step down to Janitor status:</p>
                <p>
                    <label><strong>New Owner Username:</strong></label><br>
                    <input type="text" id="newOwnerUser" required style="width: 250px;">
                </p>
                <p>
                    <button type="submit" class="btn-submit" style="background: var(--main-red); color: white; border: none; padding: 5px 10px;">Transfer Ownership & Retire</button>
                </p>
            </form>
        </fieldset>

        <fieldset class="section-box">
            <legend>Registered Users & Roles</legend>
            <ul id="usersList"></ul>
        </fieldset>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/verify.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderUsers);

        function renderUsers() {
            const users = Imageboard.getUsers();
            const list = document.getElementById('usersList');
            list.innerHTML = '';
            users.forEach(u => {
                list.innerHTML += `<li><strong>${u.username}</strong> - <span class="role-badge badge-${u.role}">${u.role.toUpperCase()}</span></li>`;
            });
        }

        function handlePromote(e) {
            e.preventDefault();
            const user = document.getElementById('janitorUser').value.trim();
            Imageboard.promoteUser(user, 'janitor');
            alert(user + ' promoted to Janitor!');
            renderUsers();
        }

        function handleRetire(e) {
            e.preventDefault();
            const newOwner = document.getElementById('newOwnerUser').value.trim();
            if (confirm('Are you sure you want to transfer site ownership to ' + newOwner + '?')) {
                Imageboard.transferOwnership(newOwner);
                alert('Ownership transferred to ' + newOwner + '!');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
