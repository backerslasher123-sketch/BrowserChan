<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board View</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="banner-box" id="bannerBox"></div>

    <h1 class="title" id="boardHeading">/b/ - Board</h1>

    <div class="sub-link"><a href="index.html">Return to dashboard</a></div>

    <form id="postForm" onsubmit="addThread(event)">
        <table class="post-table">
            <tr>
                <td class="label">Name</td>
                <td class="field"><input type="text" id="postName" placeholder="Anonymous"></td>
            </tr>
            <tr>
                <td class="label">Email</td>
                <td class="field"><input type="text" id="postEmail" value="noko"></td>
            </tr>
            <tr>
                <td class="label">Subject</td>
                <td class="field">
                    <input type="text" id="postSubject" style="width: 65%;">
                    <button type="submit" class="btn-submit">Post</button>
                </td>
            </tr>
            <tr>
                <td class="label">Comment</td>
                <td class="field"><textarea id="postComment" required style="width: 100%; height: 80px;"></textarea></td>
            </tr>
            <tr>
                <td class="label">File</td>
                <td class="field"><input type="file" id="postFile" accept="image/*"></td>
            </tr>
        </table>
    </form>

    <hr style="border: 0; border-top: 1px solid #b7c5d9; max-width: 800px; margin: 20px auto;">

    <div class="thread-container" id="threadContainer"></div>

    <div class="footer">
        <p><a href="index.html">Browserchan</a> | <a href="index.html">Return to Dashboard</a></p>
        <p style="font-size: 10px; color: #666; margin-top: 5px;">browserchan Copyright &copy; 2024-2026 browserchan-backslash</p>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/verify.js"></script>
    <script>
        let currentUri = '';

        document.addEventListener('DOMContentLoaded', () => {
            renderBanner();
            const params = new URLSearchParams(window.location.search);
            currentUri = params.get('b');
            const boards = Imageboard.getBoards();
            const board = boards.find(b => b.uri === currentUri);

            if (!board) {
                document.getElementById('boardHeading').innerText = 'Board Not Found';
                document.getElementById('postForm').style.display = 'none';
                return;
            }

            document.getElementById('boardHeading').innerText = `/${board.uri}/ - ${board.title}`;
            renderThreads();
        });

        function renderThreads() {
            const threads = Imageboard.getThreads(currentUri);
            const container = document.getElementById('threadContainer');
            const currentUser = Imageboard.getCurrentUser();
            const canDelete = currentUser.role === 'owner' || currentUser.role === 'admin' || currentUser.role === 'janitor';

            container.innerHTML = '';

            if (threads.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px;">No threads exist in this board yet. Post the first thread above!</div>';
                return;
            }

            threads.forEach(t => {
                const el = document.createElement('div');
                el.className = 'post';
                el.innerHTML = `
                    <div class="post-header">
                        <span class="subject" style="color:#0f0c5d; font-weight:bold;">${t.subject}</span>
                        <span class="author" style="color:#117743; font-weight:bold;">${t.name}</span>
                        <span>${t.date}</span>
                        <span>No.${t.id}</span>
                        ${canDelete ? `[<a href="#" onclick="deleteT(${t.id})" style="color:red;">Delete Post</a>]` : ''}
                    </div>
                    <div class="post-body">
                        ${t.image ? `<img src="${t.image}" class="post-image">` : ''}
                        <div class="post-message">${t.comment}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function addThread(e) {
            e.preventDefault();
            const name = document.getElementById('postName').value;
            const email = document.getElementById('postEmail').value;
            const subject = document.getElementById('postSubject').value;
            const comment = document.getElementById('postComment').value;
            const fileInput = document.getElementById('postFile');

            const postData = { name, email, subject, comment, image: null };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    postData.image = evt.target.result;
                    Imageboard.createThread(currentUri, postData);
                    resetFormAndRefresh();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                Imageboard.createThread(currentUri, postData);
                resetFormAndRefresh();
            }
        }

        function resetFormAndRefresh() {
            document.getElementById('postComment').value = '';
            document.getElementById('postSubject').value = '';
            document.getElementById('postFile').value = '';
            renderThreads();
        }

        function deleteT(id) {
            if (confirm('Delete thread?')) {
                Imageboard.deleteThread(currentUri, id);
                renderThreads();
            }
        }
    </script>
</body>
</html>
